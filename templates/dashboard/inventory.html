{% extends "dashboard/base.html" %}
{% load static %}
{% block staff_content %}
  <link rel="stylesheet" href="{% static 'css/inventory.css' %}">
  <header class="staff-page-heading">
    <p class="eyebrow">Stock management</p>
    <h1 class="page-title">Inventory</h1>
    <p class="muted">Edit the total stock beside a variant and save. Every change is recorded.</p>
  </header>
  <div class="stock-legend" aria-label="Stock thresholds"><span class="status-badge status-out-of-stock">0: Out of Stock</span><span class="status-badge status-low-stock">1&ndash;5: Low Stock</span><span class="status-badge status-in-stock">6+: In Stock</span></div>
  <form method="get" class="filters staff-inventory-filters"><div class="search-field"><label for="q">Product or SKU</label><input type="search" id="q" name="q" value="{{ q }}" placeholder="Search inventory"></div><div class="staff-filter-actions"><button class="button" type="submit">Search</button><a class="btn btn-outline" href="{% url 'dashboard:inventory' %}">Reset</a></div></form>
  {% include "dashboard/_inventory_table.html" %}
  <script src="{% static 'js/inventory.js' %}" defer></script>
{% endblock %}
