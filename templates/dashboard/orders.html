{% extends 'dashboard/base.html' %}
{% block staff_content %}
<header class="staff-page-heading"><p class="eyebrow">Order management</p><h1 class="page-title">Orders</h1><p class="muted">Find an order and review its payment, processing and delivery status.</p></header>
<form method="get" class="filters staff-order-filters"><div class="search-field"><label for="q">Order, customer or phone</label><input id="q" name="q" value="{{ q }}" type="search" placeholder="Search orders"></div>{% for field, label, choices, selected in filters %}<div><label for="{{ field }}">{{ label }}</label><select id="{{ field }}" name="{{ field }}"><option value="">All</option>{% for value, text in choices %}<option value="{{ value }}" {% if selected == value %}selected{% endif %}>{{ text }}</option>{% endfor %}</select></div>{% endfor %}<div class="staff-filter-actions"><button class="button" type="submit">Filter</button><a class="btn btn-outline" href="{% url 'dashboard:orders' %}">Reset</a></div></form>
{% include 'dashboard/_orders.html' %}
{% endblock %}
