<h2>Best selling products</h2><p class="muted">Non-cancelled orders; item revenue uses order snapshots and excludes shipping.</p><div class="table-scroll"><table class="variant-table"><thead><tr><th>Product</th><th>Units sold</th><th>Revenue generated</th></tr></thead><tbody>{% for item in best_sellers %}<tr><td>{{ item.name }}</td><td>{{ item.units_sold }}</td><td>Rs. {{ item.revenue|floatformat:2 }}</td></tr>{% empty %}<tr><td colspan="3">No sales in this period.</td></tr>{% endfor %}</tbody></table></div>
