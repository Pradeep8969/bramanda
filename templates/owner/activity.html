{% extends 'owner/base.html' %}
{% block staff_content %}
<header class="owner-page-heading"><p class="eyebrow">Operational history</p><h1 class="page-title">Staff activity</h1><p class="muted">Review recorded actions, references and the people behind each update.</p></header>
<form method="get" class="filters owner-activity-filters"><div><label for="staff">Staff</label><select id="staff" name="staff"><option value="">All</option>{% for member in staff_users %}<option value="{{ member.pk }}" {% if selected_staff == member.pk|stringformat:'s' %}selected{% endif %}>{{ member.username }}</option>{% endfor %}</select></div><div><label for="action">Action</label><select id="action" name="action"><option value="">All</option>{% for value, label in actions %}<option value="{{ value }}" {% if selected_action == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>{% include 'owner/_fields.html' %}<div class="owner-filter-actions"><button class="button" type="submit">Filter</button><a class="btn btn-outline" href="{% url 'owner:activity' %}">Reset</a></div></form>
{% include 'owner/_activity.html' %}
{% endblock %}
