{% extends 'owner/base.html' %}{% block staff_content %}<h1 class="page-title">Staff activity</h1><form method="get" class="filters"><div><label for="staff">Staff</label><select id="staff" name="staff"><option value="">All</option>{% for member in staff_users %}<option value="{{ member.pk }}" {% if selected_staff == member.pk|stringformat:'s' %}selected{% endif %}>{{ member.username }}</option>{% endfor %}</select></div><div><label for="action">Action</label><select id="action" name="action"><option value="">All</option>{% for value, label in actions %}<option value="{{ value }}" {% if selected_action == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>{{ form.as_p }}<button class="button">Filter</button></form>{% include 'owner/_activity.html' %}{% endblock %}
