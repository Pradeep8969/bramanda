<div class="table-scroll"><table class="variant-table"><thead><tr><th>Staff member</th><th>Action</th><th>Description</th><th>Reference</th><th>Timestamp</th></tr></thead><tbody>{% for item in activities %}<tr><td>{{ item.staff.username|default:'Deleted account' }}</td><td>{{ item.get_action_display }}</td><td>{{ item.description }}</td><td>{{ item.reference }}</td><td>{{ item.created_at }}</td></tr>{% empty %}<tr><td colspan="5">No activity recorded.</td></tr>{% endfor %}</tbody></table></div>
