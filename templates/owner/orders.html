{% extends 'owner/base.html' %}{% block staff_content %}<h1 class="page-title">Orders</h1><form method="get" class="filters"><div class="search-field"><label for="q">Order, customer or phone</label><input id="q" name="q" value="{{ q }}" type="search"></div>{% for field, label, choices, selected in filters %}<div><label for="{{ field }}">{{ label }}</label><select id="{{ field }}" name="{{ field }}"><option value="">All</option>{% for value, text in choices %}<option value="{{ value }}" {% if selected == value %}selected{% endif %}>{{ text }}</option>{% endfor %}</select></div>{% endfor %}<button class="button">Filter</button><a href="{% url 'owner:orders' %}">Reset</a></form>{% include 'owner/_orders.html' %}{% endblock %}
