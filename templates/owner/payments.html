{% extends 'owner/base.html' %}{% block staff_content %}<h1 class="page-title">Payment overview</h1><p class="muted">Payment records from orders. Cash on Delivery only.</p><form method="get" class="filters">{% for field, label, choices, selected in filters %}<div><label for="{{ field }}">{{ label }}</label><select id="{{ field }}" name="{{ field }}"><option value="">All</option>{% for value, text in choices %}<option value="{{ value }}" {% if selected == value %}selected{% endif %}>{{ text }}</option>{% endfor %}</select></div>{% endfor %}<button class="button">Filter</button></form>{% include 'owner/_orders.html' %}{% endblock %}
